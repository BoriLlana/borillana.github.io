name: Update Google Scholar stats

# Refreshes scholar-stats.json from your Google Scholar profile.
on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # lets you run it on demand from the Actions tab

# Allow the job to commit the updated JSON back to the repo.
permissions:
  contents: write

# Avoid overlapping runs.
concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar stats
        run: python scripts/fetch_scholar.py

      - name: Commit changes (only if the numbers changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-stats.json
          if git diff --staged --quiet; then
            echo "No change in Scholar stats."
          else
            git commit -m "chore: update Google Scholar stats"
            git push
          fi
